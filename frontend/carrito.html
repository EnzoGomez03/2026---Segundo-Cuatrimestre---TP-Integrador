<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuntoGym - Carrito</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
        }

        body.tema-oscuro {
            background-color: #121212;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <button id="btnTema">Cambiar tema</button>

    <h1>PuntoGym</h1>

    <h2>Carrito</h2>

    <div id="carrito"></div>

    <h3 id="total"></h3>

    <button id="btnFinalizarCompra">Finalizar Compra</button>

    <dialog id="modalConfirmar">
        <h3>Confirmar compra</h3>

        <p>¿Estás seguro de que querés finalizar la compra?</p>

        <button id="btnConfirmar">Confirmar</button>
        <button id="btnCancelar">Cancelar</button>
    </dialog>

    <script src="js/tema.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
