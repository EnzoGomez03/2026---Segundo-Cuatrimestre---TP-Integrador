<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuntoGym - Carrito</title>
    <link rel="icon" type="image/png" href="img/Logotipo deportivo PuntoGym en azul y naranja.png">
    <link rel="stylesheet" href="css/estilos.css">

</head>
<body>

    <header>
        <img src="img/Logotipo deportivo PuntoGym en azul y naranja.png"
            alt="Logo PuntoGym"
            class="logo-puntogym">
            
        <h1>PuntoGym</h1>

        <p>Enzo Gómez - Lucas Sparta</p>

        <nav>
            <button id="btnVolverProductos">Volver a productos</button>
            <button id="btnTema">Cambiar tema</button>
        </nav>
    </header>

    <h2>Carrito</h2>

    <div id="carrito"></div>

    <h3 id="total"></h3>

    <button id="btnFinalizarCompra">Finalizar Compra</button>

    <dialog id="modalConfirmar">
        <h3>Confirmar compra</h3>

        <p>¿Estás seguro de que querés finalizar la compra?</p>

        <button id="btnConfirmar">Confirmar</button>
        <button id="btnCancelar">Cancelar</button>
    </dialog>

    <script src="js/tema.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
