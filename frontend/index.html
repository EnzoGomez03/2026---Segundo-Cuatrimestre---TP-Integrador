<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuntoGym - Bienvenida</title>
    <link rel="icon" type="image/jpeg" href="img/Logotipo deportivo PuntoGym en azul y naranja.png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <img src="img/Logotipo deportivo PuntoGym en azul y naranja.png"
            alt="Logo PuntoGym"
            class="logo-puntogym">

        <h1>PuntoGym</h1>

        <p>Enzo Gómez - Lucas Sparta</p>

        <nav>
            <button id="btnAdmin">Administración</button>
            <button id="btnTema">Cambiar tema</button>
        </nav>
    </header>

    <div class="banner">
        <img src="img/PuntoGym_ Equipamiento y Fitness.png" alt="Banner PuntoGym">
    </div>

    <h2>Bienvenido a nuestro autoservicio</h2>

    <p>Ingresa tu nombre para comenzar.</p>

    <input type="text" id="nombre" placeholder="Tu nombre">

    <button id="btnContinuar">Continuar</button>

    <script src="js/tema.js"></script>
    <script src="js/bienvenida.js"></script>
</body>
</html>
