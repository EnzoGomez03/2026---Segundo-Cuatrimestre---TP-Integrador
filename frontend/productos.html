<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuntoGym - Productos</title>
    <link rel="icon" type="image/png" href="img/Logotipo deportivo PuntoGym en azul y naranja.png">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <img src="img/Logotipo deportivo PuntoGym en azul y naranja.png"
            alt="Logo PuntoGym"
            class="logo-puntogym">

        <h1>PuntoGym</h1>

        <p>Enzo Gómez - Lucas Sparta</p>

        <nav>
            <button id="btnInicio">Inicio</button>
            <button id="btnVerCarrito">Ver carrito</button>
            <button id="btnTema">Cambiar tema</button>
        </nav>
    </header>

    <h2>Productos</h2>

    <div class="categorias">
        <button id="btnEquipamiento">Equipamiento</button>
        <button id="btnAccesorios">Accesorios</button>
        <button id="btnTodos">Todos</button>
    </div>

    <div id="productos"></div>
    <div class="paginacion">
        <button id="btnAnterior">Anterior</button>
        <span id="infoPagina"></span>
        <button id="btnSiguiente">Siguiente</button>
    </div>

    <script src="js/tema.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
